[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tvheadend-admin-mcp"
version = "0.2.0"
description = "MCP server for Tvheadend DVR and complete API-exposed DVB configuration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1", "python-dotenv>=1.1,<2"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "NemoN"}]
keywords = ["tvheadend", "mcp", "dvb", "satip", "dvr", "epg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/NemoN/tvheadend-mcp"
Repository = "https://github.com/NemoN/tvheadend-mcp"
Documentation = "https://github.com/NemoN/tvheadend-mcp#readme"
Issues = "https://github.com/NemoN/tvheadend-mcp/issues"

[project.scripts]
tvheadend-mcp = "tvheadend_mcp.server:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/docs", "/examples", "/scripts", "/.github",
    "/README.md", "/README.de.md", "/LICENSE", "/CONTRIBUTING.md",
    "/SECURITY.md", "/CHANGELOG.md", "/pyproject.toml", "/uv.lock",
    "/requirements.lock", "/Dockerfile", "/.dockerignore", "/.gitignore", "/.env.example",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tvheadend_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
